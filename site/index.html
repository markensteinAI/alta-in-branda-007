.tt-v.best{color:var(--ink);font-weight:700}
.tt-v small{display:block;font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.tt-l{font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);text-align:center;padding-bottom:2px;max-width:150px}
.tt-bar{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:4px;height:6px}
.tt-bar span{display:block;height:100%;border-radius:3px}
.tt-bar .a{justify-self:end;background:var(--accent)}
.tt-bar .b{justify-self:start;background:var(--sb)}
.tt-bar .dim{opacity:.35}
.co{display:flex;flex-direction:column}
.co-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line-2);text-align:left;width:100%}
.co-row:last-child{border-bottom:0}
button.co-row:hover{background:var(--surface-2)}
.co-h{font-size:12.5px;color:var(--ink-2);padding-top:0}
.co-h span{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-row .nm{font-family:var(--f-display);font-weight:600;font-size:15.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-r{display:flex;flex-wrap:wrap;gap:4px}
.mono{font-family:var(--f-mono);font-size:13.5px;font-weight:600;letter-spacing:.01em}
.numv{display:inline-flex;align-items:center;gap:10px}
.sf-sc tr.wa td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.sf-sc tr.wb td{background:color-mix(in srgb,var(--sb) 8%,transparent)}
table.std.sf-sc th{white-space:normal;vertical-align:bottom}
table.std.sf-sc tr.grp th{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);padding-top:10px}
.sf-sc td:first-child{width:46px}
.sf-sc th .sw,.sf-sc td .sw{width:9px;height:9px;margin-right:6px}

/* venues */
.map-wrap{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
svg.map{display:block;width:100%;height:auto}
.map-wrap.real{position:relative;z-index:0;isolation:isolate}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .osm-tiles{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7)}}
:root[data-theme="dark"] .osm-tiles{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7)}
.vmap{height:min(62vh,460px);width:100%;background:var(--surface-2)}
.map-wrap .leaflet-container{font-family:var(--f-body)}
.map-wrap .leaflet-popup-content-wrapper,.map-wrap .leaflet-popup-tip{background:var(--surface);color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.map-wrap .leaflet-popup-content{margin:12px 14px}
.map-wrap .leaflet-container a.leaflet-popup-close-button{color:var(--ink-2)}
.pop{display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.35}
.pop b{font-family:var(--f-display);font-size:16px;text-transform:uppercase;line-height:1.1}
.pop-k{font-weight:600;color:var(--accent)}
.pop-btns{display:flex;gap:14px;margin-top:6px}
.map-wrap .pop-btns a,.map-wrap .pop-btns button{color:var(--accent);font-weight:600;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
svg.map .ring{fill:none;stroke:var(--ink-3);stroke-opacity:.55;stroke-dasharray:4 5}
svg.map .ref{stroke:var(--ink-3);stroke-width:1.2}
svg.map text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
svg.map .v{fill:var(--bar);stroke:var(--surface);stroke-width:1.5;cursor:pointer}
svg.map .v.g{fill:var(--accent)}
svg.map .v.sel{fill:var(--ball);stroke:var(--ink);stroke-width:1.5}
svg.map .home{fill:none;stroke:var(--ball);stroke-width:3}
.vlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:700px){.vlist{grid-template-columns:minmax(0,1fr)}}
.venue{display:flex;flex-direction:column;gap:6px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 130px)}
.venue.sel{outline:2px solid var(--ball);outline-offset:-1px}
.venue .vn{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;line-height:1.1}
.dist{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--accent);white-space:nowrap}

/* league */
.camp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gir-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);width:100%;text-align:left}
.gir-row:hover .gn{color:var(--accent)}
.gir-row .gn{font-family:var(--f-display);font-weight:700;font-size:16px;text-transform:uppercase}
.gir-row>span:first-child{min-width:0;flex:1}
.gir-row .ld{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.gir-row.cur .gn::after{content:" ●";color:var(--ball)}
.day-head{font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);padding:12px 0 2px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chip{flex:none;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(6,10,18,.5)}
.sheet-panel{position:relative;background:var(--bg);width:min(680px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:760px){.sheet{align-items:center}.sheet-panel{border-radius:18px;max-height:88vh}}
.sheet-x{position:sticky;top:0;align-self:flex-end;width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:-50px;z-index:2;flex:none}
.sheet-x svg{width:18px;height:18px}
.pick-list{display:flex;flex-direction:column;gap:14px}
.pick-camp h3{margin-bottom:6px}
.pick-gir{display:flex;flex-wrap:wrap;gap:6px}
.team-pick{display:flex;flex-direction:column}
.team-pick button{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line-2);text-align:left}
.team-pick button .nm{font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:uppercase}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}

.foot{color:var(--ink-2);font-size:13px;padding-block:8px 32px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.foot a{color:var(--accent)}
.h2h td.res{font-family:var(--f-display);font-weight:700;font-size:16px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;font-weight:600}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px}
.ctx-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px;border-radius:12px;background:var(--court-soft);color:var(--ink);font-size:14px}
.ctx-banner b{font-weight:600}
.ctx-banner button{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);padding:6px 0;min-height:36px}
.ctx-banner svg{width:16px;height:16px}
.setgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.sg{border-radius:8px;padding:7px 4px;text-align:center;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
.sg .k{font-size:11.5px;font-weight:600;letter-spacing:.02em}
.sg .v{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.h2h{display:flex;flex-direction:column}
.h2h-row{display:grid;grid-template-columns:30px minmax(0,1fr) 70px 70px;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line-2);text-align:left;width:100%}
.h2h-row:last-child{border-bottom:0}
.h2h-row:hover{background:var(--surface-2)}
.h2h-row .pos{font-family:var(--f-display);font-weight:700;color:var(--ink-2)}
.h2h-row .nm{font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2c{display:flex;flex-direction:column;align-items:flex-start;font-size:13px;line-height:1.2}
.h2c .d{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.h2c small{font-size:11.5px;color:var(--ink-2)}
.statline{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-2);font-size:14px}
.statline b{font-family:var(--f-display);font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
table.std .tform{display:none}
table.std td.team .tn{display:block;overflow:hidden;text-overflow:ellipsis}
table.std .tform .fchip{width:15px;height:15px;font-size:9.5px;border-radius:4px}
.only-narrow{display:none}
@media (max-width:640px){
  table.cls:not(.full) .x{display:none}
  table.cls:not(.full) .tform{display:block;margin-top:5px}
  table.cls:not(.full) td.team{max-width:none;white-space:normal}
  .only-narrow{display:inline-flex}
}
@media (prefers-reduced-motion:no-preference){
  .sheet-panel{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
