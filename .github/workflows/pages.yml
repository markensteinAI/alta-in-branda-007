name: Aggiorna dati e pubblica il sito

on:
  push:
    branches: [main]
  schedule:
    # ogni 4 ore (orari UTC). GitHub può far partire i lavori programmati anche con ore di ritardo:
    # più passaggi al giorno tengono la pagina aggiornata anche quando succede.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      test_notifica:
        description: 'Prova della mail di errore: aggiorna e pubblica normalmente, poi chiude il lavoro come fallito'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna-e-pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # sempre l'ultima versione di main: i lavori partono in fila e quello prima può aver già salvato dati nuovi
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Scarica i dati da ivl.usacli.it
        id: update
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/update-data.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rigenera i calendari dai dati salvati (solo se l'aggiornamento non è riuscito)
        if: steps.update.outcome != 'success'
        run: node scripts/update-data.mjs --solo-calendari

      - name: Salva nel repository i dati cambiati
        if: steps.update.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.js site/cal
          if [ -f site/storico.js ]; then git add site/storico.js; fi
          # se il repository non cambia da più di 25 giorni (fuori stagione), salva un segnale di vita:
          # GitHub sospende i lavori programmati dopo 60 giorni senza attività
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 25 * 86400 )) ]; then
            date -u +%Y-%m-%dT%H:%MZ > .github/ultimo-segnale-di-vita.txt
            git add .github/ultimo-segnale-di-vita.txt
          fi
          if git diff --cached --quiet; then
            echo "Nessuna novità nei dati"
          else
            git commit -m "Aggiornamento dati IVL $(date -u +%Y-%m-%dT%H:%MZ)"
            # in caso di conflitto sui file dei dati vale la versione appena scaricata
            git pull --rebase -X theirs origin main
            git push
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Segnala se l'aggiornamento dei dati non è riuscito
        if: steps.update.outcome != 'success'
        run: |
          echo "::error::Aggiornamento dei dati non riuscito: il sito è stato pubblicato con i dati precedenti. Apri questo lavoro e guarda il passo 'Scarica i dati da ivl.usacli.it' per il motivo."
          exit 1

      - name: Prova della mail di errore
        if: inputs.test_notifica
        run: |
          echo "::error::Prova richiesta a mano: se ricevi questa mail, gli avvisi di errore funzionano. Il sito è stato aggiornato e pubblicato normalmente."
          exit 1
